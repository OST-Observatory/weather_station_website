name: security

on:
  push:
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || pip install bandit pip-audit
      - name: Unit tests
        env:
          DJANGO_ENV: development
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: python manage.py test datasets -v2
      - name: Django system checks
        env:
          DJANGO_ENV: development
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: python manage.py check
      - name: Bandit
        run: bandit -r datasets weather_station -x '*/migrations/*' -ll
      - name: pip-audit
        run: pip-audit -r requirements.txt || true
      - name: Lockfile hashes
        run: test -f requirements.txt && grep -q -- '--hash=' requirements.txt
